name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test            # unidade + banco (PGlite: migrações, RLS, paridade)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e    # compila, sobe o preview e roda os testes de navegador
